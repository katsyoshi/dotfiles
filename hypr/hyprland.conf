
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# Match the old Sway output layout.
monitor = HDMI-A-1, preferred, auto, 1
monitor = Virtual-1, disable


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Session setup and old Sway autostarts.
exec-once = waybar
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP PATH
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP PATH
exec-once = systemctl --user start graphical-session.target
exec-once = alacritty
exec-once = discord
exec-once = firefox-bin
exec-once = fcitx5 -d
exec-once = mako -c ~/.config/mako/config.toml
exec-once = remmina
exec-once = ~/.config/xremap/run
exec-once = wl-paste --watch cliphist store
# exec-once = flameshot # disabled: command is not installed

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = alacritty
# $fileManager = dolphin # disabled: command is not installed
$menu = wofi --show drun

# Some default env vars.
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,16
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = XMODIFIERS,@im=fcitx
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = yes
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

group {
    groupbar {
        enabled = false
    }
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Match the old Sway workspace names.
workspace = 1, defaultName:1: Work
workspace = 2, defaultName:2: Web
workspace = 3, defaultName:3: SNS
workspace = 4, defaultName:4: Graphics
workspace = 5, defaultName:5: Audio Visual
workspace = 6, defaultName:6: Database
workspace = 7, defaultName:7: Game
workspace = 8, defaultName:8: IDE
workspace = 9, defaultName:9: FREESPACE
workspace = 10, defaultName:10: freespace

# Match the old Sway application placement.
windowrule = match:class (Alacritty|emacs|footclient), workspace 1 silent
windowrule = match:class (firefox|firefox-bin), workspace 2 silent
windowrule = match:class (slack|Slack|discord), workspace 3 silent
windowrule = match:class (org[.]gnome[.]Evince|geeqie|Gimp|gimp|org[.]inkscape[.]Inkscape|darktable), workspace 4 silent
windowrule = match:class (deadbeef|org[.]remmina[.]Remmina|com[.]obsproject[.]Studio), workspace 5 silent
windowrule = match:class jetbrains-studio, workspace 8 silent
windowrule = match:class imv, float true, center true
windowrule = match:class .*, suppress_event maximize


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Sway-compatible window controls
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, M, exit
# bind = $mainMod, E, exec, $fileManager # disabled: dolphin is not installed
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, D, exec, /home/katsyoshi/Program/Github/dotfiles/bin/wofi-run
bind = $mainMod, G, exec, LANG=ja_JP.utf8 wofi-window-switcher
# bind = $mainMod SHIFT, M, exec, wofi --modi combi -show # disabled: Rofi-only options

# Focus and window selection do not require SHIFT.
bind = $mainMod, J, movefocus, l
bind = $mainMod, K, movefocus, d
bind = $mainMod, L, movefocus, u
bind = $mainMod, semicolon, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Move windows within the layout by adding SHIFT to the focus bindings.
bind = $mainMod SHIFT, J, movewindow, l
bind = $mainMod SHIFT, K, movewindow, d
bind = $mainMod SHIFT, L, movewindow, u
bind = $mainMod SHIFT, semicolon, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Layout and window state
bind = $mainMod SHIFT, H, layoutmsg, preselect r
bind = $mainMod SHIFT, V, layoutmsg, preselect d
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating
bind = $mainMod, space, exec, /home/katsyoshi/Program/Github/dotfiles/bin/hypr-focus-mode-toggle
bind = $mainMod SHIFT, S, togglegroup
bind = $mainMod SHIFT, W, togglegroup
bind = $mainMod SHIFT, E, layoutmsg, togglesplit
# Sway's stacking and parent/child focus have no direct Hyprland equivalent.

# Switch workspaces with mainMod + [0-9].
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move the active window with mainMod + SHIFT + [0-9].
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces and reload config
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, Y, exec, cliphist list | wofi --dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy
bind = $mainMod, T, exec, LANG=ja_JP.utf8 wofi-window-switcher
bind = $mainMod, E, exec, ~/bin/wl-screen-shot

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod SHIFT, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:273, resizewindow

# Sway-compatible resize mode: SUPER+SHIFT+CTRL+R, then J/K/L/; or arrows.
bind = $mainMod SHIFT CTRL, R, submap, resize
submap = resize
binde = , J, resizeactive, -10 0
binde = , K, resizeactive, 0 10
binde = , L, resizeactive, 0 -10
binde = , semicolon, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , down, resizeactive, 0 10
binde = , up, resizeactive, 0 -10
binde = , right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
